# 바퀴벌레 포커 — Cloudflare Workers 무료 플랜 (로보77 과 같은 짜임)
# 화면 파일(public/ — 그림·글꼴 포함)은 정적 자산으로 나간다. 정적 자산은 요청 수 한도에 잡히지 않고 무료다.
# 소켓(/ws)만 Worker → Durable Object 하나(main)로 간다. 방은 전부 그 안 메모리에 산다(저장소를 쓰지 않는다).
# 무료 플랜에서는 SQLite 저장소 방식의 Durable Object 만 쓸 수 있다(new_sqlite_classes).
# 결제 수단을 등록하지 않으므로 한도를 넘어도 요금이 붙지 않고, 그날 남은 요청만 거절된다.
name = "cockroach"
main = "worker.js"
compatibility_date = "2026-08-01"
# process.env 를 쓰려고 켠다 — 시험 때만 --var ROACH_FAST:1 로 판을 빨리 돌린다. 배포본에는 그 값이 없다.
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/healthz"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "RoachGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoachGame"]
